<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.textDirection%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="google-site-verification" content="CaGQLeieWTOy6MzeS3XCzYVHdT9Cb7w33y4OHwzM-DE" />
		<!-- Warm DNS + TLS to mapbox while the rest of the page is parsing,
		     so the base-map style/tiles arrive ~50-200 ms sooner on cold loads. -->
		<link rel="preconnect" href="https://api.mapbox.com" crossorigin />
		<link rel="preconnect" href="https://events.mapbox.com" crossorigin />
		<!-- Preload the mapbox style JSON so the request starts at HTML parse,
		     not after mapbox-gl has downloaded and initialised. Saves ~100 ms
		     on cold loads. The URL must match exactly what mapbox-gl v3 requests:
		     `?sdk=js-<version>&access_token=<public pk.*>`. The token is
		     injected at build time from PUBLIC_MAPBOX_TOKEN; the style ID and
		     mapbox-gl version are hardcoded and must be kept in sync with
		     MapBox.svelte and the installed mapbox-gl. A mismatched preload
		     is silently ignored by the browser and wastes a fetch. -->
		<link
			rel="preload"
			as="fetch"
			crossorigin
			href="https://api.mapbox.com/styles/v1/viktorbengtsson/cm34o762h00a801o09g4q99uq?optimize=true&sdk=js-3.19.0&access_token=%sveltekit.env.PUBLIC_MAPBOX_TOKEN%"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
